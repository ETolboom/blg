[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".venv",
    ".git",
    ".idea",
    ".vscode",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "cache",
    "target",
]

[project]
name = "blg"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # spaCy model declared by release-wheel URL so `uv sync` tracks it instead of
    # pruning it (it used to be installed out-of-band via `spacy download`).
    "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    "fastapi>=0.122.0",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "pip>=25.3",
    "pydantic>=2.12.4",
    "python-multipart>=0.0.22",
    "rust_bpmn_analyzer-bindings>=0.1.1",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "sentence-transformers>=5.2.3",
    "spacy>=3.8.11",
    "thefuzz>=0.22.1",
    "torch>=2.9.1",
    "transformers>=4.57.2",
    "uvicorn>=0.38.0",
]

[tool.ruff.lint]
select = ["E", "F", "UP"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
# Tooling needed to develop/test/lint — never imported by the running app, so it
# stays out of [project].dependencies. `uv sync` installs these by default.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.14",
    "ty>=0.0.18",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
