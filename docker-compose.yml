services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount the data root (assignments/ + global templates/)
      - ./backend/data:/app/data
    platform: linux/amd64
    environment:
      - HOST=0.0.0.0
      - PORT=8000
