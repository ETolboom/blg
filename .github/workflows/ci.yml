name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff · ty · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      # ty is young (0.0.x) and still reports known false/legacy positives, so it
      # runs informationally for now. Tracked follow-up: make this a hard gate.
      - name: Type check (ty) — non-blocking
        run: uv run ty check
        continue-on-error: true

      - name: Tests
        run: uv run pytest -q

  frontend:
    name: Frontend (vue-tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (vue-tsc)
        run: bun run lint
